<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向 5 岁半儿童的家庭英语启蒙执行计划，包含逐周安排、长辈播放清单和家长检查任务。"
    />
    <title>Kiki 英语启蒙计划</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css"
    />
    <style>
      :root {
        --theme-color: #24745a;
        --text-color-base: #26332f;
        --text-color-secondary: #5d6b66;
        --border-color: #dfe7e3;
        --surface-muted: #f5f8f6;
        --notice-color: #a66013;
      }

      body {
        color: var(--text-color-base);
        letter-spacing: 0;
      }

      .app-name-link,
      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: var(--text-color-base);
        letter-spacing: 0;
      }

      .sidebar {
        border-right: 1px solid var(--border-color);
      }

      .sidebar-nav > ul > li > p {
        color: var(--text-color-secondary);
        font-size: 0.78rem;
        font-weight: 700;
        margin: 1.4rem 0 0.45rem;
        text-transform: uppercase;
      }

      .markdown-section {
        max-width: 900px;
        padding: 40px 44px 80px;
      }

      .markdown-section blockquote {
        background: var(--surface-muted);
        border-left: 4px solid var(--theme-color);
        color: var(--text-color-secondary);
        margin: 1.5rem 0;
        padding: 0.8rem 1rem;
      }

      .markdown-section table {
        display: table;
        width: 100%;
      }

      .markdown-section th {
        background: var(--surface-muted);
      }

      .markdown-section code {
        background: #f3f5f4;
        border-radius: 4px;
        color: #7a3e00;
      }

      .search .matching-post {
        border-bottom: 1px solid var(--border-color);
      }

      .markdown-section a {
        font-weight: 500;
      }

      .markdown-section strong {
        color: var(--notice-color);
      }

      @media (max-width: 768px) {
        .markdown-section {
          padding: 28px 20px 60px;
        }

        .markdown-section table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">正在加载英语启蒙计划...</div>
    <script>
      const repositoryPath = '/kiki-learn-english/';
      const isProjectSite = window.location.pathname.startsWith(repositoryPath);

      window.$docsify = {
        name: 'Kiki 英语启蒙计划',
        repo: 'wikyyuen/kiki-learn-english',
        homepage: 'README.md',
        basePath: isProjectSite ? repositoryPath : '/',
        loadSidebar: true,
        auto2top: true,
        subMaxLevel: 2,
        maxLevel: 3,
        relativePath: true,
        notFoundPage: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: '搜索计划和任务',
          noData: '没有找到相关内容',
          depth: 3,
          hideOtherSidebarContent: false
        },
        plugins: [
          function labelSearchField(hook) {
            const labelSearch = () => {
              const searchField = document.querySelector('.search input');
              if (!searchField) return;

              searchField.id = 'docs-search';
              searchField.name = 'docs-search';
              searchField.setAttribute('aria-label', '搜索计划和任务');
            };

            hook.ready(labelSearch);
            hook.doneEach(labelSearch);
          }
        ]
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  </body>
</html>
